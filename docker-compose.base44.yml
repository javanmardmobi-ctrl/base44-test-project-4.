services:
  web:
    image: python:3.12-slim
    working_dir: /site
    command: ["python", "-m", "http.server", "3000", "--bind", "0.0.0.0"]
    volumes:
      - .:/site
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE
      - PYTHONUNBUFFERED=1
    labels:
      base44.project: "Base44 Test Project"
      base44.kind: "web"
      base44.port: "3000"
    restart: on-failure
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000/', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
