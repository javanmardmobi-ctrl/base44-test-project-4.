name: horizon-properties

services:
  api:
    image: node:22-alpine
    working_dir: /app
    restart: on-failure
    environment:
      - PORT=8000
      - DATA_DIR=/var/lib/horizon
      - NODE_ENV=development
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - api_data:/var/lib/horizon
    command:
      [
        'sh',
        '-ec',
        'npm ci --omit=dev --no-audit --no-fund && exec node --watch server/index.mjs',
      ]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    labels:
      base44.project: 'Horizon Properties API'
      base44.kind: 'api'
      base44.docs: '/api/health'

  web:
    image: node:22-alpine
    working_dir: /app
    restart: on-failure
    ports:
      - '3000:5173'
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - API_PROXY_TARGET=http://api:8000
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    command:
      [
        'sh',
        '-ec',
        'npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173',
      ]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    labels:
      base44.project: 'Horizon Properties'
      base44.kind: 'web'
      base44.port: '3000'

volumes:
  web_node_modules:
  api_node_modules:
  api_data:
